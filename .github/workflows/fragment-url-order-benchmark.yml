name: Fragment URL PostgreSQL lookup research
on:
  push:
    branches: [research/indexed-fragment-url-lookup]

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: benchmark
          POSTGRES_DB: fragment_benchmark
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: benchmark
      PGDATABASE: fragment_benchmark
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL client if needed
        run: command -v psql || { sudo apt-get update -qq && sudo apt-get install -y postgresql-client; }
      - name: Verify indexed URL lookup against PostgreSQL 17
        run: psql -v ON_ERROR_STOP=1 -f experiments/fragment-url-order/benchmark.sql | tee /tmp/benchmark-output.txt
      - name: Store query-plan evidence
        uses: actions/upload-artifact@v4
        with:
          name: fragment-url-query-plans
          path: /tmp/benchmark-output.txt
